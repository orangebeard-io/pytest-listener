name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      # no --with-deps: the runner already has Chromium's libraries, and apt only added fonts from a slow mirror.
      # Should an image ever lack a library, the Playwright tests fail (they do not skip in CI).
      - run: python -m playwright install chromium
      - run: python -m pytest -rs
        env:
          ORANGEBEARD_TOKEN: ${{ secrets.ORANGEBEARD_TOKEN }}
          ORANGEBEARD_ATTRIBUTES: python:${{ matrix.python-version }};pipelineUrl:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
